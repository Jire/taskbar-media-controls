name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          for f in extension/*.js; do
            echo "$f"
            node --input-type=module --check < "$f"
          done

      - name: Check metadata.json
        run: python3 -c 'import json; m = json.load(open("extension/metadata.json")); assert m["uuid"] and m["shell-version"]'

      - name: ShellCheck
        run: shellcheck install.sh scripts/*.sh

      - name: Build zip
        run: scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
